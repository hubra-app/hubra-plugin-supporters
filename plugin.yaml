id: supporters
name: Supporters
version: "1.0.0"
hubra: ">=0.2,<1"
description: "Sponsors and fundraising: sponsor packages, the yearly sponsor invoice and logos for the club website, and fundraising goals with a target, a progress bar and donations from members and others."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-supporters
tags: [finance, sponsors, donations, fundraising]
package: hubra_supporters
modules: [supporters]
requires: [members, finance]
migrations: migrations
frontend: frontend/dist/plugin.js
# The areas this plugin extends; Hubra refuses a plugin that touches one it
# doesn't list. See docs/plugins.md in hubra-app/hubra.
uses: [routes, public, tables, nav, frontend]
